name: api-foundry
services:
  api:
    build: .
    image: api-foundry:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/foundry.db
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  api_data:
  caddy_data:
  caddy_config:
